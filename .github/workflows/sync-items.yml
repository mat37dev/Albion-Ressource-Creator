name: Sync Albion Items

on:
  # Sync quotidien à 2h du matin UTC
  schedule:
    - cron: '0 2 * * *'

  # Trigger manuel depuis l'interface GitHub
  workflow_dispatch:

  # Trigger sur push (optionnel, pour tester)
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'scripts/sync-items.ts'

jobs:
  sync:
    name: Sync Items from ao-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        run: npm run sync:items
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Sync failed! Check the logs above."
          exit 1

      - name: Notify on success
        if: success()
        run: echo "✅ Sync completed successfully!"
