name: Sync Albion Data

on:
  # Sync quotidien à 2h du matin UTC
  schedule:
    - cron: '0 2 * * *'

  # Trigger manuel depuis l'interface GitHub
  workflow_dispatch:

jobs:
  sync:
    name: Sync Items & Recipes from ao-data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync items
        run: npm run sync:items

      - name: Sync recipes
        run: npm run sync:recipes

      - name: Notify on success
        if: success()
        run: echo "✅ Sync completed successfully!"
